# migrate-plex-to-jellyfin configuration file
# Copy to config.yml and fill in your values.
# All values here can be overridden by CLI flags.

plex:
  # Saltbox default: Plex is reachable on the saltbox Docker network as plex:32400
  url: http://plex:32400
  token: YOUR_PLEX_TOKEN_HERE

jellyfin:
  # Saltbox default: Jellyfin is reachable on the saltbox Docker network as jellyfin:8096
  url: http://jellyfin:8096
  token: YOUR_JELLYFIN_API_KEY_HERE

options:
  # Migrate all Plex users in one run
  all_users: true

  # Create Jellyfin accounts for Plex users who don't have one yet
  auto_create_user: true

  # Preview what would happen without writing anything
  dry_run: false

  # Migrate Plex star ratings to Jellyfin
  migrate_ratings: false

  # Mark items rated >=9 in Plex as Jellyfin favorites
  migrate_favorites: false

  # Migrate Plex lastViewedAt timestamps to Jellyfin DatePlayed
  migrate_timestamps: true

  # Migrate Plex viewOffset resume positions to Jellyfin PlaybackPositionTicks
  migrate_positions: true

  # Verify SSL certificates (set false for self-signed certs)
  secure: false

  # Directory for migration reports. Relative paths resolve inside /app/config in Docker.
  report_dir: reports

# Optional Plex user -> existing Jellyfin user assignments.
# Use this when a Plex display name should migrate into an existing Jellyfin account
# instead of creating a new account with the Plex name.
user_mappings: {}
# user_mappings:
#   "Gavin Snell (Gavin8tor245)": "gavin"
#   "JP": "john"

# Path translations: Plex path prefix | Jellyfin path prefix
# Needed when Plex and Jellyfin mount the same media at different paths.
# Leave empty if paths match (common in Saltbox setups).
translations: []
# translations:
#   - "/mnt/plex/Media|/data/Media"
